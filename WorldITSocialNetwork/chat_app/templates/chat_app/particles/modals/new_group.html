{% load static %}

<dialog class="new-group-dialog">
    <button class="new-group-close" type="button">
        <img src="{% static 'icon/cross.svg' %}" alt="">
    </button>

    <form class="new-group-step is-active" data-step="members">
        <h2>Нова група</h2>

        <label class="new-group-search">
            <span></span>
            <input type="search" placeholder="Пошук">
        </label>

        <p class="new-group-selected">Вибрано: <span>3</span></p>

        <div class="new-group-list"></div>

        <div class="new-group-actions">
            <button class="new-group-secondary" id="cancel" type="button">Скасувати</button>
            <button class="button-purple new-group-next" type="button">Далі</button>
        </div>
    </form>

    <form class="new-group-step" data-step="details">
        <h2>Нова група</h2>

        <label class="new-group-field">
            <span>Назва</span>
            <input type="text" placeholder="Введіть назву">
        </label>

        <div class="new-group-photo-preview">NG</div>

        <div class="new-group-photo-actions">
            <button type="button">+ <span>Додайте фото</span></button>
            <button type="button"><img src="{% static 'icon/image.svg' %}" alt=""> <span>Оберіть фото</span></button>
        </div>

        <div class="new-group-participants">
            <p>Учасники</p>

            <div class="new-group-participant">
                <span class="new-group-avatar">NP</span>
                <span>Aeslie Alexander</span>
                <button type="button">
                    <img src="{% static 'icon/cross.svg' %}" alt="">
                </button>
            </div>
            <div class="new-group-participant">
                <span class="new-group-avatar">NP</span>
                <span>Aeslie Alexander</span>
                <button type="button">
                    <img src="{% static 'icon/cross.svg' %}" alt="">
                </button>
            </div>
            <div class="new-group-participant">
                <span class="new-group-avatar">NP</span>
                <span>Aeslie Alexander</span>
                <button type="button">
                    <img src="{% static 'icon/cross.svg' %}" alt="">
                </button>
            </div>
        </div>

        <div class="new-group-actions">
            <button class="new-group-secondary new-group-back" type="button">Назад</button>
            <button class="button-purple new-group-create" type="button">Створити групу</button>
        </div>
    </form>
</dialog>
