{% for user in users %}
    <div class="user-card">
        <div class="user-card-info">
            <img src="/icon/mockup-icon.png" alt="">

            <div>
                <p>TODO: make pseudonyms</p>
                <p>@{{ user.username }}</p>
            </div>
        </div>

        <div class="user-card-buttons">
            {% if mode == "requests" %}
                <button id="acceptUser">Підтвердити</button>

            {% elif mode == "recommendations" %}
                <button id="addUser">Додати</button>

            {% elif mode == "all_friends" %}
                <button id="messageUser">Повідомлення</button>

            {% endif %}

            <button id="deleteUser">Видалити</button>
        </div>
    </div>
{% endfor %}
