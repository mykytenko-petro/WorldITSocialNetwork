<div class="section-login">
    <nav class="login-head">
        <p id = "open-register-form" class="register">Реєстрація</p>
        <p id = "open-login-form" class="login"><u>Авторизація</u></p>
    </nav>
    <p class="paragraf">Раді тебе знову бачити!</p>
    <form action="{% url 'login' %}" method="post" class="form-authorization" id = "login-form-container">
        {% csrf_token %}
        {{ form_login.as_div }}
        <button class="button-authorization" type="submit">Увійти</button>
    </form>
</div>
