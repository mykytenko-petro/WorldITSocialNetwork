{% load static %}

<dialog class="create-post-form" id="create-post-form">
    <div>
        <button class="close"><img src="{% static "icon/cross.svg" %}"></button>
    </div>

    <p class="title">Створення публікації</p>

    <form action="{% url "post_app.post_creation" %}" enctype="multipart/form-data">
        <div>
            {{ post_creation_form.title }}
        </div>
        <div>
            {{ post_creation_form.topic }}
        </div>
        <div>
            {{ post_creation_form.tags }}
        </div>
        <div>
            {{ post_creation_form.content }}
        </div>
        <div>
            {{ post_creation_form.images }}
        </div>
    </form>

    <div>
        <button class="button-purple publish" id="send">Публікація</button>
    </div>
</dialog>

<div class="post-create" id="create-post">
    <textarea placeholder="Текст публікації"></textarea>
    <div>
        <button class="button-edit button-purple">Перейти до оформлення</button>
    </div>
</div>
